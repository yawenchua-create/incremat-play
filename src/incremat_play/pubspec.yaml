name: incremat_play
description: "IncreMat Play — elderly-facing companion app with gamified pet progression."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Persistence
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  confetti: ^0.7.0
  video_player: ^2.9.2
  nfc_manager: ^3.3.0

  # Direct Bluetooth link to the mat for low-latency live rep syncing
  flutter_blue_plus: ^1.35.3

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6

# Android-only app. Pin the iOS video implementation to a pre-objective_c
# version so package:objective_c (whose native build hook fails on Windows
# paths containing spaces) is kept out of the build entirely.
dependency_overrides:
  video_player_avfoundation: 2.6.1
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/pets/
    - assets/animations/

