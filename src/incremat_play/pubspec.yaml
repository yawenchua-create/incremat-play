name: incremat_play
description: "IncreMat Play — elderly-facing companion app with gamified pet progression."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Persistence
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  confetti: ^0.7.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/pets/

